name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # go.mod states the minimum Go version; build with the latest stable
      # release so binaries get standard library security fixes.
      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: Check go.mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "FAIL: go.mod/go.sum not tidy" && exit 1)

      - name: Check gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "FAIL: files not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14

      - name: Test
        run: go test -race ./...

      - name: Vulnerability check
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  release:
    name: Release
    needs: check
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: true

      - name: GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean

      - name: Validate release archives
        run: |
          set -euo pipefail
          for tarball in dist/*.tar.gz; do
            echo "==> Checking $tarball"

            contents=$(tar tzf "$tarball")

            if echo "$contents" | grep -qx '\./$\|^\.'; then
              echo "FAIL: $tarball contains a '.' directory entry"
              echo "$contents" | head -20
              exit 1
            fi

            for f in paperflow README.md LICENSE; do
              if ! echo "$contents" | grep -q "$f"; then
                echo "FAIL: $tarball missing $f"
                echo "$contents"
                exit 1
              fi
            done

            echo "  OK"
          done

      - name: Auto-tag release
        id: tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          VERSION="v$(cat VERSION)"
          if git tag -l "$VERSION" | grep -q . || git ls-remote --tags origin "$VERSION" | grep -q .; then
            echo "Tag $VERSION already exists, skipping."
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            echo "Creating tag $VERSION"
            git tag "$VERSION"
            git push origin "$VERSION"
            echo "created=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Write AUR SSH key
        if: steps.tag.outputs.created == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "$AUR_KEY_CONTENT" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan -t rsa aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null || true
          echo "AUR_KEY_PATH=$HOME/.ssh/aur_key" >> "$GITHUB_ENV"
        env:
          AUR_KEY_CONTENT: ${{ secrets.AUR_SSH_KEY }}

      - name: Run GoReleaser
        if: steps.tag.outputs.created == 'true'
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          AUR_KEY: ${{ env.AUR_KEY_PATH }}

  nix:
    name: Nix
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: DeterminateSystems/nix-installer-action@main

      - name: Build Nix package
        run: |
          if ! output=$(nix build .#paperflow 2>&1); then
            echo "$output"
            new_hash=$(echo "$output" | awk '/got:/ {print $2}')
            if [ -n "$new_hash" ]; then
              echo "::error file=default.nix::vendorHash is stale; set it to $new_hash"
            fi
            exit 1
          fi
