name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  aur:
    runs-on: ubuntu-latest
    needs: release
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Download checksums
        run: gh release download "$GITHUB_REF_NAME" --pattern checksums.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update PKGBUILD and generate .SRCINFO
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          AMD64_SHA=$(grep "linux_amd64" checksums.txt | awk '{print $1}')
          ARM64_SHA=$(grep "linux_arm64" checksums.txt | awk '{print $1}')

          cd aur
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${AMD64_SHA}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${ARM64_SHA}')/" PKGBUILD

          # Generate .SRCINFO (tabs are required by AUR format)
          TAB="$(printf '\t')"
          {
            echo "pkgbase = paperflow-bin"
            echo "${TAB}pkgdesc = File organizer and Paperless-ngx ingestion tool"
            echo "${TAB}pkgver = ${VERSION}"
            echo "${TAB}pkgrel = 1"
            echo "${TAB}url = https://github.com/alcxyz/paperflow"
            echo "${TAB}arch = x86_64"
            echo "${TAB}arch = aarch64"
            echo "${TAB}license = MIT"
            echo "${TAB}depends = libnotify"
            echo "${TAB}provides = paperflow"
            echo "${TAB}conflicts = paperflow"
            echo ""
            echo "pkgname = paperflow-bin"
            echo "${TAB}source_x86_64 = https://github.com/alcxyz/paperflow/releases/download/v${VERSION}/paperflow_${VERSION}_linux_amd64.tar.gz"
            echo "${TAB}sha256sums_x86_64 = ${AMD64_SHA}"
            echo "${TAB}source_aarch64 = https://github.com/alcxyz/paperflow/releases/download/v${VERSION}/paperflow_${VERSION}_linux_arm64.tar.gz"
            echo "${TAB}sha256sums_aarch64 = ${ARM64_SHA}"
          } > .SRCINFO

      - name: Push to AUR
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_SSH_KEY }}" > ~/.ssh/aur_key
          chmod 600 ~/.ssh/aur_key
          ssh-keyscan aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/aur_key -o IdentitiesOnly=yes"

          git clone ssh://aur@aur.archlinux.org/paperflow-bin.git /tmp/aur-pkg
          cp aur/PKGBUILD aur/.SRCINFO /tmp/aur-pkg/

          cd /tmp/aur-pkg
          git config user.name "alcxyz"
          git config user.email "me@alc.xyz"
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git commit -m "Update to v${{ steps.version.outputs.version }}"
            git push
          fi
